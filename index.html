<!DOCTYPE html><html lang="zh-CN"><head>  <meta charset="UTF-8" />  <meta name="viewport" content="width=device-width, initial-scale=1.0" />  <title>AI 建站接单展示页</title>  <style>    * { box-sizing: border-box; }    body {      margin: 0;      font-family: Arial, "Microsoft YaHei", sans-serif;      background: #f6f8fb;      color: #172033;    }    .hero {      min-height: 92vh;      padding: 64px 20px 48px;      background: linear-gradient(135deg, #101827, #2457c5 58%, #21a67a);      color: white;      display: flex;      align-items: center;    }    .container { width: 100%; max-width: 1080px; margin: 0 auto; }    .tag {      display: inline-flex;      align-items: center;      padding: 8px 14px;      border-radius: 999px;      background: rgba(255,255,255,0.16);      border: 1px solid rgba(255,255,255,0.18);      font-size: 14px;      margin-bottom: 22px;    }    h1 { max-width: 820px; font-size: 48px; line-height: 1.18; margin: 0 0 20px; }    .lead { max-width: 760px; font-size: 19px; line-height: 1.8; margin: 0 0 16px; color: rgba(255,255,255,0.9); }    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin: 30px 0 36px; }    .button { display: inline-block; padding: 14px 20px; border-radius: 10px; text-decoration: none; font-weight: 700; }    .primary { background: #25c46b; color: white; }    .secondary { background: rgba(255,255,255,0.14); color: white; border: 1px solid rgba(255,255,255,0.22); }    .cards, .service-grid, .step-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }    .card { background: white; color: #172033; border-radius: 10px; padding: 22px; box-shadow: 0 14px 36px rgba(10, 18, 32, 0.18); }    .card h2, .service h3, .step h3 { font-size: 20px; margin: 0 0 10px; }    .card p, .service p, .step p { font-size: 15px; line-height: 1.7; color: #536176; margin: 0; }    section { padding: 56px 20px; }    .section-title { font-size: 30px; margin: 0 0 14px; }    .section-desc { max-width: 760px; line-height: 1.8; color: #5a6678; margin: 0 0 26px; }    .service, .step { background: white; border: 1px solid #e4e9f2; border-radius: 10px; padding: 22px; }    .price { font-size: 28px; font-weight: 800; color: #1f6feb; margin: 12px 0; }    ul { padding-left: 20px; margin: 12px 0 0; color: #556276; line-height: 1.8; }    .contact { background: #101827; color: white; text-align: center; }    .contact p { color: rgba(255,255,255,0.82); }    @media (max-width: 640px) {      h1 { font-size: 34px; }      .lead { font-size: 16px; }      .hero { padding-top: 46px; }      .section-title { font-size: 24px; }    }  </style></head><body>  <header class="hero">    <div class="container">      <div class="tag">非计算机大学生 · 用 Codex 辅助做网站</div>      <h1>非计算机大学生，用 Codex 帮你做简单网站。</h1>
