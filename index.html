<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 赚钱成长记录</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .hero {
      min-height: 100vh;
      padding: 60px 20px;
      background: linear-gradient(135deg, #111827, #2563eb);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
    }

    .tag {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.15);
      margin-bottom: 20px;
      font-size: 14px;
    }

    h1 {
      font-size: 44px;
      line-height: 1.2;
      margin: 0 0 20px;
    }

    p {
      font-size: 18px;
      line-height: 1.8;
      margin: 0 0 18px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 34px;
    }

    .card {
      background: white;
      color: #222;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
    }

    .card h2 {
      font-size: 20px;
      margin: 0 0 10px;
    }

    .card p {
      font-size: 15px;
      color: #555;
      margin: 0;
    }

    .button {
      display: inline-block;
      margin-top: 28px;
      padding: 14px 22px;
      background: #22c55e;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 32px;
      }

      p {
        font-size: 16px;
      }

      .hero {
        padding: 40px 18px;
      }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="container">
      <div class="tag">非计算机大学生的 AI 赚钱挑战</div>
      <h1>我正在用 AI，从 0 开始做项目赚钱。</h1>
      <p>
        我是一名普通大学生，正在挑战用 30 天跑通第一个 AI 赚钱闭环：
        学会做网站、发布作品、记录成长，并尝试接到第一单。
      </p>
      <p>
        这个页面是我的第一个 AI 网站项目，也是我从 0 到 1 的开始。
      </p>

      <a class="button" href="#">联系我</a>

      <div class="cards">
        <div class="card">
          <h2>当前目标</h2>
          <p>30 天内做出 4 个网站案例，并拿到第一笔收入。</p>
        </div>
        <div class="card">
          <h2>学习方向</h2>
          <p>AI 辅助建站、个人展示页、商家落地页和简单自动化。</p>
        </div>
        <div class="card">
          <h2>项目记录</h2>
          <p>每天记录自己用 AI 做项目、踩坑、修改和上线的过程。</p>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
